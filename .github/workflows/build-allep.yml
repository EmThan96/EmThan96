# Test and package every plugin in plugins/* as .allep
# - every push / pull request: tests + .allep files as build artifact
# - tag push (e.g. HBT_Fixture-v1.0.1 or v1.0.1): GitHub release draft with the .allep files attached
name: Build .allep packages

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: pip install pytest pyyaml pillow

      - name: Run tests of all plugins
        run: |
          for d in plugins/*/tests; do
            echo "== $d"; python -m pytest -q "$d"
          done
          python -m pytest -q tools

      - name: Build .allep packages
        run: python tools/build_allep.py

      - uses: actions/upload-artifact@v4
        with:
          name: allep-packages
          path: dist/*.allep

      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --draft dist/*_*.allep
